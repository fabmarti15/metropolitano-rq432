<style>:root{--paper:#FCFCFA;--card:#FFF;--ink:#111417;--ink-2:#565E66;--ink-3:#8C949B;--line:#E8E6E0;--line-2:#F1EFEA;
--green:#0A4A3E;--green-2:#0F6E56;--green-soft:#EEF4F1;--signal:#C2410C;--signal-soft:#FDF1EA;
--oro:#8A5A00;--oro-soft:#FBF3E2;--rojo:#D6413A;--radius:12px;--sans:'Archivo','Helvetica Neue',Helvetica,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:40px}
a{color:var(--green-2)}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
/* header */
.hd{position:sticky;top:0;z-index:40;background:rgba(252,252,250,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
display:flex;align-items:center;gap:10px;padding:9px 18px;min-height:56px}
.atras{border:0;background:transparent;padding:6px;margin-left:-6px;cursor:pointer;display:none;color:var(--ink-2)}
.atras.on{display:block}
.atras svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.marca{border:0;background:transparent;display:flex;align-items:center;gap:9px;cursor:pointer;padding:0;color:inherit;font:inherit}
.marca img{height:26px;width:auto;display:block}
.marca b{font-size:15px;letter-spacing:-.01em}
.marca span{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.hd .sep{width:1px;height:20px;background:var(--line)}
.fed{margin-left:auto;font-size:11.5px;font-weight:600;text-decoration:none;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.fed:hover{color:var(--green)}
.fed .pelota{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
/* tabs */
.tabs{position:sticky;top:56px;z-index:35;background:rgba(252,252,250,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1000px;margin:0 auto;padding:0 18px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--ink-3);padding:12px 12px 10px;cursor:pointer;
display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent;white-space:nowrap}
.tab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=true]{color:var(--green);border-bottom-color:var(--green)}
/* hero */
.hero{padding:28px 0 20px;border-bottom:1px solid var(--line);margin-bottom:20px}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green-2);font-weight:700}
h1{font-size:clamp(25px,4.2vw,38px);line-height:1.05;letter-spacing:-.022em;margin:9px 0 8px;font-weight:700}
.sub{color:var(--ink-2);font-size:14.5px;margin:0;max-width:64ch;line-height:1.55}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px;min-width:88px}
.kpi b{display:block;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.warn{margin:16px 0 0;padding:11px 14px;background:var(--signal-soft);border-left:3px solid var(--signal);border-radius:0 8px 8px 0;font-size:13px;color:#7C2D12;line-height:1.5}
/* buscador */
.buscador{display:flex;gap:10px;align-items:center;margin:0 0 18px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:170px;font:inherit;font-size:14px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink)}
input[type=search]:focus{outline:2px solid var(--green-soft);border-color:var(--green-2)}
.clear{border:0;background:transparent;color:var(--ink-3);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
/* chips de categoria */
.catchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.catchips button{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px}
.catchips button:hover{border-color:var(--green-2);color:var(--green)}
.catchips button[aria-current=true]{background:var(--green);border-color:var(--green);color:#fff}
.catchips .n{font-size:10.5px;opacity:.65;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
/* secciones dia */
h2.sec{font-size:18px;letter-spacing:-.012em;margin:0 0 12px;font-weight:700;padding-bottom:9px;border-bottom:2px solid var(--green);display:flex;align-items:center;gap:10px}
h2.sec .cnt{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-left:auto}
.dia{margin-bottom:30px}
.slot-h{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--green-2);padding:12px 0 5px}
/* fila partido */
.m{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.m:hover{border-color:var(--green-2)}
.m .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;width:56px;flex:none;padding-top:1px}
.m .t .dayl{display:block;font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.m .code{font-size:10.5px;font-weight:700;color:var(--ink-3);background:var(--line-2);border-radius:5px;padding:3px 6px;flex:none;min-width:42px;text-align:center}
.mid{flex:1;min-width:0}
.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:999px;margin:0 0 5px}
.chip.r{background:var(--line-2);color:var(--ink-2)}
.pair{display:flex;align-items:center;gap:7px 10px;flex-wrap:wrap}
.p{display:flex;align-items:baseline;gap:6px;min-width:0}
.seed{font-size:10px;font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:700;min-width:13px;text-align:right}
.nm{font-size:14px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.nm.tbd{color:var(--ink-3);font-style:italic;font-weight:400}
.vs{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);flex:none}
.tag-pos{display:none}
.m.is-pos{border-style:dashed;background:repeating-linear-gradient(135deg,var(--card),var(--card) 7px,#FBFAF7 7px,#FBFAF7 14px)}
.m.is-pos .tag-pos{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--signal-soft);color:var(--signal);margin:0 5px 5px 0}
.nota{font-size:13px;color:var(--ink-2);line-height:1.55;margin:8px 0 16px}
/* colores categoria */
.c-oro{background:var(--oro-soft);color:var(--oro)}.c-plata{background:#EFF1F3;color:#4B5563}
.c-bronce{background:#F6EDE6;color:#8A4B22}.c-dobles{background:var(--green-soft);color:var(--green)}
.c-dobles-plata{background:#EAF1EE;color:var(--green-2)}.c-senior-60{background:#EEF0F8;color:#3F4A78}
.c-principiantes{background:#F2F5EA;color:#5A6B33}.c-damas{background:#F9EDF3;color:#8A3B62}
.c-junior-oro{background:#FFF4E0;color:#8A5A00}.c-junior-plata{background:#F1F0EC;color:#5C5A52}
.c-multibote{background:#E9F2F6;color:#245C70}
/* ===== BRACKET ===== */
.brwrap{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:auto;-webkit-overflow-scrolling:touch;margin-bottom:8px}
.brhead{display:flex;position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line-2);z-index:2}
.brhead div{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--green-2);padding:9px 0 8px;flex:none;text-align:center}
.br{position:relative}
.br svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.br svg path{fill:none;stroke:#DCD9D2;stroke-width:1.5}
.bc{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 8px 5px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.bc:hover{border-color:var(--green-2);box-shadow:0 1px 6px rgba(10,74,62,.09)}
.bc-h{display:flex;align-items:center;gap:6px;margin-bottom:1px}
.bc-h .cd{font-size:9.5px;font-weight:700;color:var(--ink-3);background:var(--line-2);border-radius:4px;padding:1px 5px}
.bc-h .cw{font-size:9.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--green-2);font-variant-numeric:tabular-nums}
.bc-h .cw.wo{color:var(--ink-3)}
.sl{display:flex;align-items:baseline;gap:6px;padding:1px 0}
.sl i{font-style:normal;font-size:9.5px;font-weight:700;color:var(--ink-3);min-width:13px;text-align:right;font-variant-numeric:tabular-nums}
.sl span{font-size:12.5px;font-weight:500;line-height:1.25;overflow-wrap:anywhere}
.sl span.tbd{color:var(--ink-3);font-style:italic;font-weight:400;font-size:12px}
.bc.hl{border-color:var(--rojo);box-shadow:0 0 0 2px rgba(214,65,58,.16)}
.bc.hl .sl span.on{color:var(--rojo);font-weight:700}
.brhint{font-size:12px;color:var(--ink-3);margin:0 0 20px}
/* grupos */
.grupo{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px;margin-bottom:14px}
.grupo h3{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--green-2)}
.grupo ol{margin:0 0 4px;padding-left:20px}
.grupo li{font-size:14px;padding:2px 0}
/* tabla ranking */
.tabla{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
.tabla th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--line-2)}
.tabla td{padding:9px 12px;border-bottom:1px solid var(--line-2)}
.tabla tr:last-child td{border-bottom:0}
.tabla tr:hover td{background:#FBFAF7}
.tabla .pos{font-variant-numeric:tabular-nums;font-weight:700;width:44px;color:var(--ink-2)}
.tabla .pts{font-variant-numeric:tabular-nums;text-align:right;width:92px;color:var(--ink-2)}
.tabla .top1 .pos{color:var(--oro)}
.tabla a{text-decoration:none;color:inherit;font-weight:500}
.tabla a:hover{color:var(--green);text-decoration:underline}
.tabla .cero{color:var(--ink-3)}
/* jugadores */
.jlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:8px}
.jc{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.jc:hover{border-color:var(--green-2)}
.jc .av{width:32px;height:32px;border-radius:50%;background:var(--green-soft);color:var(--green);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:.02em}
.jc .info{min-width:0}
.jc .nn{font-size:13.5px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.jc .cc{font-size:11px;color:var(--ink-3);margin-top:2px}
/* ficha jugador */
.ficha{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:20px}
.ficha .avb{width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.ficha h1{margin:0 0 10px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fchips .fc{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;display:flex;align-items:center;gap:6px}
.fchips .fc b{font-variant-numeric:tabular-nums}
.natlink{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--green);background:var(--green-soft);padding:7px 12px;border-radius:999px}
.natlink:hover{background:#E3EDE8}
.vacio{padding:26px 0;color:var(--ink-3);font-size:14px}
/* pie */
footer{border-top:1px solid var(--line);margin-top:36px;padding-top:20px;font-size:12.5px;color:var(--ink-3);line-height:1.65}
footer b{color:var(--ink-2)}
footer p{margin:0 0 9px}
.hidden{display:none!important}
@media(max-width:600px){
 .tabs{top:52px}.hd{min-height:52px;padding:7px 14px}.wrap{padding:0 14px}
 .m{flex-wrap:wrap;gap:7px}.m .t{width:auto}.marca span{display:none}
 .kpi{flex:1;min-width:74px;padding:8px 10px}.kpi b{font-size:17px}
}
/* ranking completo */
.tablawrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tablawrap .tabla{border:0;border-radius:0;min-width:100%}
.tabla th.fx,.tabla td.fx{text-align:right;width:66px;font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:12.5px}
.tabla td.fx.cero{color:#C9CDD1}
.tabla tr.juega td{background:#FCFDFC}
.tabla tr.juega:hover td{background:var(--green-soft)}
.bj{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:1px 6px;border-radius:999px;background:var(--green-soft);color:var(--green);margin-left:7px;vertical-align:1px}
@media(max-width:760px){.tabla th.fx,.tabla td.fx{display:none}}
/* chips de ranking en la ficha */
.fc.rkc{border:1px solid var(--line);background:var(--card);cursor:pointer;font:inherit;font-size:11.5px;font-weight:600;color:var(--ink-2);padding:5px 11px}
.fc.rkc:hover{border-color:var(--green-2);color:var(--green)}
.fc.rkc b{color:var(--green);font-size:13px;margin-right:2px}
.fc.rkc span{color:var(--ink-3);font-weight:500}
.jc.juega .av{background:var(--green);color:#fff}
/* grafico de evolucion */
.evo{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px 14px 10px;margin-bottom:12px}
.evo-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
.evo-h b{font-size:14.5px;letter-spacing:-.01em}
.ev-b{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.ev-b.sube{background:var(--green-soft);color:var(--green)}
.ev-b.baja{background:var(--signal-soft);color:var(--signal)}
.evosvg{width:100%;height:auto;aspect-ratio:560/150;display:block;overflow:visible}
.evosvg path{fill:none;stroke:var(--green);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.evosvg circle{fill:var(--card);stroke:var(--green);stroke-width:2;vector-effect:non-scaling-stroke}
.evosvg circle.fin{fill:var(--green)}
.evosvg .lp{font-size:11px;font-weight:700;fill:var(--ink);text-anchor:middle}
.evosvg .lf{font-size:10px;font-weight:600;fill:var(--ink-3);text-anchor:middle}
.evosvg .lf2{font-size:9px;font-weight:500}
/* resultados en listas y llaves */
.m.listo{border-color:#D8DFDB}
.p.gano .nm{font-weight:700}
.p.perdio .nm{color:var(--ink-3)}
.marc{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);margin-top:4px;letter-spacing:.01em}
.sl.gano span{font-weight:700}
.sl.perdio span{color:var(--ink-3)}
.bmarc{font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--ink-3);margin-top:3px;border-top:1px solid var(--line-2);padding-top:3px}
/* podio */
.podio{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:0 0 20px}
.pod{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.pod .lbl{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.pod b{font-size:15px;letter-spacing:-.01em;line-height:1.25;display:block}
.pod .mk{display:block;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:3px}
.pod.campeon{background:var(--oro-soft);border-color:#EBDCB6}
.pod.campeon .lbl,.pod.campeon b{color:var(--oro)}
/* forma y carrera */
.forma{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 14px}
.gp{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff}
.gp.g{background:var(--green)} .gp.pp{background:#C2410C}
.carrera{list-style:none;padding:0;margin:0}
.carrera li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px}
.carrera .cw{display:block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.carrera b{font-size:14px;font-weight:600}
.carrera .sc{display:block;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:2px}
/* vista subir */
.paso{display:flex;gap:12px;margin-bottom:16px}
.paso-n{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.paso-c{flex:1;min-width:0}
.paso-c label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px}
.paso-c .lab2{font-weight:500;color:var(--ink-3)}
select,textarea,input[type=password]{width:100%;font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.45;resize:vertical}
select:focus,textarea:focus,input[type=password]:focus{outline:2px solid var(--green-soft);border-color:var(--green-2)}
.btn{margin-top:9px;font:inherit;font-size:13.5px;font-weight:600;border:0;background:var(--green);color:#fff;padding:9px 16px;border-radius:999px;cursor:pointer}
.btn:hover{background:var(--green-2)} .btn:disabled{background:var(--line);color:var(--ink-3);cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink-2);border:1px solid var(--line)}
.btn.mini{padding:4px 10px;font-size:12px;margin:4px 4px 0 0}
.fila-btn{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.estado{font-size:13px;margin-top:10px;line-height:1.5}
.ok{color:var(--green);font-weight:600} .warn2{color:var(--signal);font-weight:600}
.tabla tr.duda td{background:var(--signal-soft)}
.q{font-style:italic;color:var(--ink-2)}
.msg{font-size:11.5px;color:var(--signal);margin-top:3px}
.opts{margin-top:2px}
.ayuda{margin-top:14px;font-size:13px;color:var(--ink-2)}
.ayuda summary{cursor:pointer;font-weight:600;color:var(--green)}
.ayuda ol{margin:8px 0;padding-left:20px;line-height:1.6}

<script>/* Lector de resultados pegados desde el Excel del fixture.
   Acepta el TSV que produce Excel al copiar una hoja completa. */
const RE_CODE=/^(P|PD|PJ|PJB|PS|PP|PDD|MB)-?\d+\*?$/i;
const RE_SETS=/^\s*\d{1,2}(\s+\d{1,2}){1,6}\s*$/;
const RE_WO=/^\s*(w\.?o\.?|walkover|no se presento|no se presentó)\s*$/i;
const CERCA=[0,1,-1,2,-2,3,-3,4];
const RE_HORA=/(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)?\s*\d{1,2}[:.]\d{2}/i;

function grid(txt){
  return txt.replace(/\r/g,'').split('\n').map(l=>l.split('\t').map(s=>s.trim()));
}
const at=(G,r,c)=>((G[r]||[])[c]||'').trim();
const esNombre=s=>s.length>3 && /[a-záéíóúñ]/i.test(s) && !/\d/.test(s) &&
  !RE_HORA.test(s) && !/^(bye|wo|w\.o\.|ganador|perdedor|primero|segundo|tercero|cuarto|grupo|cuadro|categoria|categoría|ronda|final|semifinal|8vos|4tos|caida|caída)/i.test(s);
const sets=s=>RE_SETS.test(s)?s.trim().split(/\s+/).map(Number):null;

function leer(txt){
  const G=grid(txt), out=[], avisos=[];
  let cat=null;
  for(const row of G) for(const cel of row){
    const m=cel.match(/^(?:CUADRO|Categoria|Categoría)\s+(.+)$/i);
    if(m && !cat) cat=m[1].trim();
  }
  for(let r=0;r<G.length;r++) for(let c=0;c<(G[r]||[]).length;c++){
    const cel=at(G,r,c); if(!RE_CODE.test(cel)) continue;
    const code=cel.toUpperCase().replace(/\s/g,'');
    let rec={code, sets:[], gan:null, wo:false, nombres:[]};

    // --- forma GRUPO: nombre en (r±1,c+1), marcador en (r±1,c+2)
    const nA=at(G,r-1,c+1), nB=at(G,r+1,c+1);
    if(esNombre(nA)&&esNombre(nB)){
      rec.nombres=[nA,nB];
      const sA=sets(at(G,r-1,c+2)), sB=sets(at(G,r+1,c+2));
      if(sA&&sB) rec.sets=sA.map((v,i)=>[v,sB[i]??0]);
      if(RE_WO.test(at(G,r,c+2))||RE_WO.test(at(G,r,c+1))) rec.wo=true;
      rec.forma='grupo';
    } else {
      // --- forma LLAVE: dos marcadores en la misma columna, filas cercanas
      let mejor=null;
      for(let dc=2;dc<=6&&!mejor;dc++){
        const hall=[];
        for(const dr of CERCA){const s=sets(at(G,r+dr,c+dc)); if(s)hall.push({dr,s})}
        hall.sort((a,b)=>a.dr-b.dr);
        let cand=null;
        for(let i=0;i<hall.length-1;i++){
          const a=hall[i],b=hall[i+1];
          if(b.dr-a.dr<=2 && a.s.length===b.s.length){
            const d=Math.min(Math.abs(a.dr),Math.abs(b.dr));
            if(!cand||d<cand.d) cand={d,dc,a:a.s,b:b.s};
          }
        }
        if(cand) mejor=cand;
      }
      if(mejor) rec.sets=mejor.a.map((v,i)=>[v,mejor.b[i]]);
      // nombre del que avanza: primero en la fila del código, alejándose desde ahí
      const dc0=mejor?mejor.dc:3;
      for(const dr of CERCA){
        for(let dc=dc0;dc<=dc0+4;dc++){const s=at(G,r+dr,c+dc); if(esNombre(s)){rec.gan=s;break}}
        if(rec.gan)break;
      }
      for(let dr=-1;dr<=2&&!rec.wo;dr++) for(let dc=1;dc<=5;dc++) if(RE_WO.test(at(G,r+dr,c+dc)))rec.wo=true;
      rec.forma='llave';
    }
    if(!rec.sets.length && !rec.wo && !rec.gan) continue;   // partido sin jugar
    if(rec.sets.length){
      let ga=0,gb=0; for(const [x,y] of rec.sets){ if(x>y)ga++; else if(y>x)gb++ }
      if(ga===gb){ avisos.push(`${code}: el marcador no define un ganador (${ga}-${gb} games)`); rec.duda=true; }
      // el marcador se guarda SIEMPRE desde el ganador: [suyo, del rival]
      if(gb>ga) rec.sets=rec.sets.map(([x,y])=>[y,x]);
      rec.games=[Math.max(ga,gb),Math.min(ga,gb)];
      // en fase de grupos no hay nombre escrito: el ganador sale del marcador
      if(!rec.gan && rec.nombres.length===2) rec.gan = (gb>ga? rec.nombres[1] : rec.nombres[0]);
    }
    out.push(rec);
  }
  return {cat, partidos:out, avisos};
}
if(typeof module!=='undefined') module.exports={leer, grid, esNombre, sets};

/* ===== motor de resultados ===== */
let RES={};            // code -> {w:'a'|'b', s:[[A,B],...], wo:bool}
let META_RES={};       // {actualizado, por}
const _res={};

function limpiarCache(){ for(const k in _res) delete _res[k] }

function ladoDe(code,k,R){
  R=R||RES;
  const L=MB[code][k];
  if(L.src){ const g = L.tipo==='Perdedor' ? perdedorDe(L.src,R) : ganadorDe(L.src,R);
             return g||{txt:L.t, tbd:true} }
  if(L.tipo==='real') return {txt:L.t, pl:L.pl, tbd:false};
  return {txt:L.t, tbd:true};
}
function ganadorDe(code,R){
  R=R||RES;
  const m=MB[code]; if(!m) return null;
  const r=R[code];
  if(r) return ladoDe(code, r.w, R);
  if(m.n==='walkover'){                       // bye: pasa el único real
    const reales=['a','b'].filter(k=>m[k].tipo==='real'||m[k].src);
    if(reales.length===1) return ladoDe(code,reales[0],R);
  }
  return null;
}
function perdedorDe(code,R){
  R=R||RES;
  const m=MB[code]; if(!m) return null;
  const r=R[code];
  if(r) return ladoDe(code, r.w==='a'?'b':'a', R);
  if(m.n==='walkover'){                       // en un bye no hay perdedor real
    const reales=['a','b'].filter(k=>m[k].tipo==='real'||m[k].src);
    if(reales.length===1) return {txt:'Nadie (bye)', tbd:true};
  }
  return null;
}
function jugado(code,R){ return !!(R||RES)[code] }
function marcador(code,R){
  const r=(R||RES)[code]; if(!r||!r.s||!r.s.length) return '';
  const w=r.w==='a'?0:1;
  return r.s.map(p=>`${p[w]}-${p[1-w]}`).join(', ');
}
/* orden de rondas para resolver de adelante hacia atrás */
const ORD_R=['Play-in','1ra ronda','Grupo 1','Grupo 2','8vos','4tos','Semifinal','Final'];
function porRonda(codes){
  return codes.slice().sort((a,b)=>(ORD_R.indexOf(MB[a].rnd)-ORD_R.indexOf(MB[b].rnd))||a.localeCompare(b));
}
/* podio de una categoría */
function podio(cat){
  const codes=cat.codes;
  const fin=codes.find(c=>MB[c].rnd==='Final'); if(!fin||!RES[fin]) return null;
  const r=RES[fin], campeon=ladoDe(fin,r.w), segundo=ladoDe(fin, r.w==='a'?'b':'a');
  const semis=codes.filter(c=>MB[c].rnd==='Semifinal'&&RES[c])
    .map(c=>ladoDe(c, RES[c].w==='a'?'b':'a')).filter(x=>x&&!x.tbd);
  return {campeon, segundo, semis, marcador:marcador(fin)};
}
/* récord y cruces de cada jugador, derivados de RES */
function historial(){
  const H={};
  const add=(lado,rival,gano,code)=>{
    if(!lado||lado.tbd) return;
    const ns=lado.pl||[lado.txt];
    for(const n of ns){
      const s=slugDe(n); if(!s) continue;
      (H[s]=H[s]||{g:0,p:0,cruces:{},partidos:[]});
      H[s][gano?'g':'p']++;
      H[s].partidos.push({code,gano,rival:rival&&rival.txt});
      if(rival&&!rival.tbd){ const k=rival.txt; H[s].cruces[k]=H[s].cruces[k]||{g:0,p:0}; H[s].cruces[k][gano?'g':'p']++ }
    }
  };
  for(const code in RES){
    const r=RES[code], m=MB[code]; if(!m) continue;
    const A=ladoDe(code,'a'), B=ladoDe(code,'b');
    add(A,B,r.w==='a',code); add(B,A,r.w==='b',code);
  }
  return H;
}
const _slug={};
function slugDe(nom){
  if(nom in _slug) return _slug[nom];
  const n=norm(nom);
  let p=D.players.find(x=>norm(x.nom)===n) || D.players.find(x=>x.q.split(/\s{2,}/).some(a=>a.trim()===n));
  if(!p){ const w=n.split(' '); p=D.players.find(x=>{const y=norm(x.nom).split(' ');return y[0]===w[0]&&y[y.length-1]===w[w.length-1]}) }
  return _slug[nom]=p?p.slug:null;
}

function leerPegado(){
  const catSlug=document.getElementById('cat').value, txt=document.getElementById('pega').value;
  const cat=CAT[catSlug];
  if(!txt.trim()){alert('Falta pegar el contenido de la hoja');return}
  const R=leer(txt);
  const work=Object.assign({},RES), filas=[];
  const propios=new Set(cat.codes);
  for(const p of porRondaParsed(R.partidos, catSlug)){
    const code=catDeCodigo(p.code, catSlug);
    if(!propios.has(code)) continue;                 // código que no es de esta categoría
    if(!p.gan){ filas.push({code, leido:null, estado:'sinjugar'}); continue }
    const A=ladoDe(code,'a',work), B=ladoDe(code,'b',work);
    const opts=[A.txt,B.txt];
    if(A.tbd&&B.tbd){ filas.push({code, leido:p.gan, estado:'sinjugar', opts}); continue }
    const g=norm(p.gan);
    const calza=x=>{ if(x.tbd) return false; const t=norm(x.txt);
      if(t===g) return true;
      const gp=g.split(/\s*\/\s*/), tp=t.split(/\s*\/\s*/);
      if(gp.length===tp.length&&gp.length>1) return gp.every((q,i)=>apellidoCalza(tp[i],q));
      return apellidoCalza(t,g) };
    let w = calza(A)?'a' : calza(B)?'b' : null;
    if(!w){ filas.push({code, leido:p.gan, estado: (A.tbd||B.tbd)?'sinjugar':'nocalza', opts, p, marc:p.sets.map(x=>x[0]+'-'+x[1]).join(', ')}); continue }
    const s = p.sets.map(([x,y])=> w==='a'?[x,y]:[y,x]);
    work[code]={w, s, wo:!!p.wo};
    filas.push({code, gan: w==='a'?A.txt:B.txt, marc:p.sets.map(x=>x[0]+'-'+x[1]).join(', '), estado:'ok', w, s, wo:!!p.wo, opts});
  }
  PEND={catSlug, filas, work};
  pintarPrev();
  if(R.avisos.length) document.getElementById('estado').innerHTML='<span class="warn2">'+R.avisos.map(esc).join('<br>')+'</span>';
}
function apellidoCalza(a,b){
  const wa=a.split(' ').filter(x=>x.length>2), wb=b.split(' ').filter(x=>x.length>2);
  if(!wa.length||!wb.length) return false;
  return wa[wa.length-1]===wb[wb.length-1] || wa.some(x=>wb.includes(x)&&x.length>4);
}
function porRondaParsed(ps, catSlug){
  const cat=CAT[catSlug];
  return ps.slice().sort((a,b)=>{
    const ca=catDeCodigo(a.code,catSlug), cb=catDeCodigo(b.code,catSlug);
    const ra=MB[ca]?ORD_R.indexOf(MB[ca].rnd):9, rb=MB[cb]?ORD_R.indexOf(MB[cb].rnd):9;
    return ra-rb;
  });
}
function fixLado(i,lado){
  const f=PEND.filas[i], code=f.code;
  const A=ladoDe(code,'a',PEND.work), B=ladoDe(code,'b',PEND.work);
  const s=(f.p&&f.p.sets||[]).map(([x,y])=> lado==='a'?[x,y]:[y,x]);
  PEND.work[code]={w:lado, s, wo:!!(f.p&&f.p.wo)};
  Object.assign(f,{estado:'ok', w:lado, s, gan: lado==='a'?A.txt:B.txt,
    marc:(f.p&&f.p.sets||[]).map(x=>x[0]+'-'+x[1]).join(', ')});
  pintarPrev();
}

async function publicar(){
  const tok=document.getElementById('tok').value.trim(), est=document.getElementById('estado');
  if(!tok){est.innerHTML='<span class="warn2">Falta el token</span>';return}
  if(!PEND){est.innerHTML='<span class="warn2">Primero lee los resultados</span>';return}
  est.textContent='Publicando…';
  const nuevo=Object.assign({},RES);
  PEND.filas.filter(f=>f.estado==='ok').forEach(f=>{nuevo[f.code]={w:f.w,s:f.s,wo:f.wo}});
  const cuerpo={actualizado:new Date().toISOString(), partidos:nuevo};
  const url=`https://api.github.com/repos/${REPO}/contents/${ARCHIVO}`;
  const h={Authorization:'Bearer '+tok, Accept:'application/vnd.github+json'};
  try{
    let sha=null;
    const g=await fetch(url+'?t='+Date.now(),{headers:h});
    if(g.status===200) sha=(await g.json()).sha;
    else if(g.status===401||g.status===403){est.innerHTML='<span class="warn2">El token no sirve o no tiene permiso de escritura en el repo</span>';return}
    const contenido=btoa(unescape(encodeURIComponent(JSON.stringify(cuerpo,null,1))));
    const p=await fetch(url,{method:'PUT',headers:h,body:JSON.stringify({
      message:`resultados: ${CAT[PEND.catSlug].nom} (${PEND.filas.filter(f=>f.estado==='ok').length} partidos)`,
      content:contenido, sha:sha||undefined})});
    if(!p.ok){const t=await p.text(); est.innerHTML='<span class="warn2">No se pudo publicar: '+esc(t.slice(0,180))+'</span>';return}
    RES=nuevo; META_RES={actualizado:cuerpo.actualizado}; limpiarCache(); PEND=null;
    est.innerHTML='<span class="ok">Listo. El sitio queda actualizado en 1 o 2 minutos.</span>';
    document.getElementById('pega').value=''; document.getElementById('prev').innerHTML='';
  }catch(e){ est.innerHTML='<span class="warn2">Error de red: '+esc(String(e.message||e))+'</span>' }
}

/* ---------- BRACKET ---------- */
const CW=210,GAP=46,ROW=76,PAD=10;
function layout(cat){
  const codes=cat.codes.filter(c=>ROUNDS.includes(MB[c].rnd));
  const cols=ROUNDS.filter(r=>codes.some(c=>MB[c].rnd===r));
  const cix=Object.fromEntries(cols.map((r,i)=>[r,i]));
  const kids=c=>['a','b'].map(k=>MB[c][k].src).filter(x=>x&&codes.includes(x));
  const alim=new Set(); codes.forEach(c=>kids(c).forEach(k=>alim.add(k)));
  const roots=codes.filter(c=>!alim.has(c));
  const Y={}; let cur=0, seen=new Set();
  (function walk(c){
    if(seen.has(c))return Y[c]; seen.add(c);
    const ks=kids(c);
    if(!ks.length){Y[c]=cur+0.5;cur++;return Y[c]}
    const ys=ks.map(walk);
    Y[c]=ys.reduce((a,b)=>a+b,0)/ys.length; return Y[c];
  });
  roots.forEach(r=>{ // recorrer hijos primero, en orden
    (function dfs(c){ if(seen.has(c))return; const ks=kids(c); ks.forEach(dfs);
      if(!ks.length){Y[c]=cur+0.5;cur++} else {const ys=ks.map(k=>Y[k]);Y[c]=ys.reduce((a,b)=>a+b,0)/ys.length}
      seen.add(c);})(r);
  });
  const pos=c=>({x:PAD+cix[MB[c].rnd]*(CW+GAP), y:PAD+(Y[c]-0.5)*ROW});
  return {cols,cix,codes,kids,pos,W:PAD*2+cols.length*(CW+GAP)-GAP,H:PAD*2+cur*ROW};
}
function bracket(cat){
  const L=layout(cat); if(!L.codes.length)return '';
  const CH=58;
  let cards='',paths='';
  L.codes.forEach(c=>{
    const m=MB[c],p=L.pos(c);
    let cw=m.h?`${DIA[m.d]||''} ${m.h}`.trim():'pasa directo'; if(RES[c])cw='jugado';
    const wo=!m.h&&!RES[c];
    cards+=`<button class="bc" data-m="${c}" data-q="${esc(m.q)}" style="left:${p.x}px;top:${p.y}px;width:${CW}px;min-height:${CH}px">
      <div class="bc-h"><span class="cd">${esc(m.lbl)}</span><span class="cw${wo?' wo':''}">${esc(cw)}</span></div>
      ${['a','b'].map(k=>{const L2=m[k], Rz=ladoDe(c,k), r=RES[c];
        return `<div class="sl${r?(r.w===k?' gano':' perdio'):''}"><i>${L2.s||''}</i><span class="${Rz.tbd?'tbd':''}">${esc(Rz.txt)}</span></div>`}).join('')}
      ${marcador(c)?`<div class="bmarc">${esc(marcador(c))}</div>`:''}
    </button>`;
    L.kids(c).forEach(k=>{
      const q=L.pos(k), x1=q.x+CW, y1=q.y+CH/2, x2=p.x, y2=p.y+CH/2, mx=x1+GAP/2;
      paths+=`<path d="M${x1} ${y1} H${mx} V${y2} H${x2}"/>`;
    });
  });
  const head=L.cols.map((r,i)=>`<div style="width:${CW+(i<L.cols.length-1?GAP:0)}px;margin-left:${i?0:PAD}px">${r}</div>`).join('');
  return `<div class="brwrap"><div class="brhead" style="min-width:${L.W}px">${head}</div>
   <div class="br" style="width:${L.W}px;height:${L.H}px">
    <svg width="${L.W}" height="${L.H}">${paths}</svg>${cards}</div></div>
   <p class="brhint">Desliza para ver todas las rondas. Toca un partido para su detalle.</p>`;
}

/* ---------- grafico de evolucion ---------- */
function evolucion(r, cat){
  const T=D.rank[cat]; const ev=r.ev; if(!ev||!ev.length)return '';
  const W=560,H=150,ml=16,mr=16,mt=26,mb=34;
  const xs=i=>ml+i*((W-ml-mr)/(ev.length-1));
  const max=Math.max(...ev.map(e=>e.pos),T.n), min=1;
  const ys=p=>mt+((p-min)/Math.max(1,max-min))*(H-mt-mb);
  const pts_=ev.map((e,i)=>[xs(i),ys(e.pos)]);
  const linea=pts_.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const puntos=ev.map((e,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(e.pos).toFixed(1)}" r="${i===ev.length-1?5:3.5}" class="${i===ev.length-1?'fin':''}"/>
    <text x="${xs(i).toFixed(1)}" y="${(ys(e.pos)-11).toFixed(1)}" class="lp">${e.pos}º</text>`).join('');
  const ejes=T.fechas.map((f,i)=>`<text x="${xs(i).toFixed(1)}" y="${H-14}" class="lf">${esc(f[0])}</text>
    <text x="${xs(i).toFixed(1)}" y="${H-3}" class="lf lf2">${esc(f[1].split(' ')[0].slice(0,3).toLowerCase())} ${esc(f[1].split(' ')[1].slice(2))}</text>`).join('');
  const d=ev[ev.length-1].pos-ev[ev.length-2].pos;
  const badge=d===0?'<span class="ev-b">se mantuvo</span>':d<0?`<span class="ev-b sube">↑ subió ${-d}</span>`:`<span class="ev-b baja">↓ bajó ${d}</span>`;
  return `<div class="evo"><div class="evo-h"><b>${esc(cat)} · ${r.p}º de ${T.n}</b>${badge}</div>
   <svg viewBox="0 0 ${W} ${H}" class="evosvg"><path d="${linea}"/>${puntos}${ejes}</svg>
   <p class="nota" style="margin:2px 0 0">Cada punto es el puesto que tenía sumando sus puntos hasta esa fecha. Las columnas van en el orden del Excel del club, no cronológico.</p></div>`;
}

function vRanking(cat){

   ${chips}
   <div class="tablawrap"><table class="tabla"><thead><tr><th>#</th><th>Jugador</th>${th}<th style="text-align:right">Total</th></tr></thead>

function vJugadores(){
  return `<div class="wrap"><section class="hero"><div class="kicker">Jugadores</div><h1>${D.players.length} en el club</h1>
   <p class="sub">Los ${D.meta.njug} que juegan esta 4ta fecha van marcados. Toca a cualquiera para ver su ranking, su evolución y sus partidos.</p></section>

function vJugador(sl){
  const p=PL[sl]; if(!p)return vJugadores();

  const rk=p.rank.map(r=>`<button class="fc rkc" data-rk="${encodeURIComponent(r.c)}"><b>${r.p}º</b> ${esc(r.c)} <span>${pts(r.pts)} pts</span></button>`).join('');
  const nat=p.uid?`<a class="natlink" href="https://fabmarti15.github.io/circuito-racquetball/#jugador/${encodeURIComponent(p.uid)}" target="_blank" rel="noopener"><span class="pelota"></span>Ver su ficha en el ranking nacional</a>`:'';
  const evos=p.rank.filter(r=>r.pts>0).map(r=>evolucion(r,r.c)).join('');
  const juega=p.partidos.length;
  const ord=(a,b)=>(DIX[MB[a].d]??9)-(DIX[MB[b].d]??9)||tk(MB[a].h||'0:00')-tk(MB[b].h||'0:00');
  return `<div class="wrap"><section class="ficha"><div class="avb">${esc(ini(p.nom))}</div><h1>${esc(p.nom)}</h1>
   ${rk?`<div class="fchips">${rk}</div>`:'<p class="nota">Todavía sin puntos en el ranking del club.</p>'}
   ${cs?`<div class="fchips">${cs}</div>`:'<p class="nota">No juega esta 4ta fecha.</p>'}
   ${nat}</section>
   ${evos?`<h2 class="sec">Evolución en el ranking<span class="cnt">${pl(p.rank.filter(r=>r.pts>0).length,'categoría','categorías')}</span></h2>${evos}`:''}
   ${bloquesResultado(p)}
   ${juega?`<h2 class="sec" style="margin-top:26px">Por jugar<span class="cnt">${pl(juega,'confirmado')}</span></h2>
     ${p.partidos.slice().sort(ord).map(c=>fila(c,{dia:true})).join('')}`:''}
   ${p.pos.length?`<h2 class="sec" style="margin-top:26px">Si va ganando<span class="cnt">${pl(p.pos.length,'posible')}</span></h2>
    <p class="nota">Partidos que le tocarían según cómo avance en la llave. No están confirmados.</p>
    ${p.pos.slice().sort(ord).map(c=>fila(c,{dia:true})).join('')}`:''}
   ${pie()}</div>`;
}
function vPartido(code){
  const m=MB[code]; if(!m)return vInicio();
  const c=CATBY[m.cat];
  const jug=[...m.a.pl,...m.b.pl];
  const src=['a','b'].map(k=>m[k].src).filter(Boolean);

   <div class="fchips" style="margin-top:14px"><span class="fc c-${c.slug}">${esc(c.tipo)}</span><span class="fc c-${c.slug}">${esc(c.formato)}</span></div>
   </section>

   ${jug.length?`<h2 class="sec" style="margin-top:22px">Fichas</h2><div class="jlist">${jug.map(n=>{const p=D.players.find(x=>x.nom===n);return p?`<button class="jc" data-j="${p.slug}"><span class="av">${esc(ini(n))}</span><span class="info"><span class="nn">${esc(n)}</span><span class="cc">${p.cats.map(y=>esc(y.c)).join(' • ')}</span></span></button>`:''}).join('')}</div>`:''}
   ${src.length?`<h2 class="sec" style="margin-top:22px">De dónde sale</h2>${src.map(s=>fila(s,{dia:true})).join('')}`:''}
   <h2 class="sec" style="margin-top:22px">Su llave</h2><p class="nota">${esc(c.nota)}</p>
   <button class="jc" data-cat="${c.slug}" style="max-width:320px"><span class="av"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h6v12h6M16 12h4"/></svg></span><span class="info"><span class="nn">Ver la llave de ${esc(c.nom)}</span><span class="cc">${pl(c.n,'partido')}</span></span></button>
   ${pie()}</div>`;
}
function pie(){
  const disc=D.discrepa.map(([a,b])=>`${a} → ${b}`).join(' · ');
  return `<footer><p><b>Cómo leer la llave.</b> El número antes del nombre es el seed. "Ganador P5" / "Perdedor P17" significa que el rival sale de ese partido: en Oro los perdedores de 1ra ronda caen a Bronce y los de 8vos caen a Plata.</p>
  <p><b>Nombres cruzados con la base nacional.</b> Las parejas de dobles llevan los dos nombres completos (el Excel solo trae apellidos) y la grafía viene del padrón de ${D.meta.nnat} jugadores de <a href="https://fabmarti15.github.io/circuito-racquetball/">circuito-racquetball</a>. El buscador acepta las dos versiones.</p>
  <p><b>Grafías que no calzan entre las dos bases</b> (manda la del Excel, la nacional queda como alias de búsqueda): ${esc(disc)}.</p>
  <p><b>Solo en el metropolitano</b>, sin ficha en el ranking nacional: ${esc(D.solo.join(', '))}.</p>
  <p><b>Los dos Excel no siempre calzan.</b> Manda el <i>Ranking Metropolitano 2026</i>; los seeds de los cuadros quedan como se sortearon. Descalces detectados: Gabriel Gonzalez aparece con 2.325 pts y 6º en la hoja de inscritos y con 2.525 y 5º en el ranking; los seeds de Junior Oro salen de Junior B, pero Cristina Escoda (5.400) y Gabriel Coca (4.500) traen cifras que no están en ninguna de las dos hojas Junior.</p>
  <p><b>Las fechas del ranking van en el orden del Excel</b>, que no es cronológico: la 4ª y la 5ª dicen septiembre y diciembre de 2025, después de la 3ª de julio 2026. Además vienen con erratas (\"Dicmebre\", \"Mayo 2025\", \"Julio 2025\"). Se dejaron tal cual y solo se unificó la etiqueta.</p>
  <p><b>Inconsistencias del Excel original.</b> Los códigos P39 a P42 se repiten en Plata y en Bronce. En Dobles Plata hay un PD16 duplicado el sábado 16:00 y una celda con #REF!. Multibote no tiene horarios por partido, solo el bloque sábado 10:40–12:00.</p>
  <p><a href="#subir">Subir resultados</a> · solo para la organización.</p>
  <p>Armado desde <i>Fixture 4ta Fecha 2026.xlsx</i> (hoja Inscritos + los 11 cuadros).</p></footer>`;
}

/* ---------- router ---------- */
const TABS=[['inicio','Inicio','M4 11.5 12 4l8 7.5|M6 10.5V20h12v-9.5'],
 ['llaves','Llaves','M4 6h5v12h5M14 12h6|M14 6h6M14 18h6'],
 ['ranking','Ranking','M5 20V11M12 20V4M19 20v-7'],
 ['jugadores','Jugadores','circle|M5 20c1.2-3.6 3.8-5.4 7-5.4s5.8 1.8 7 5.4']];
function pintarTabs(act){
  document.getElementById('tabs').innerHTML=TABS.map(([id,lbl,d])=>{
    const paths=d.split('|').map(x=>x==='circle'?'<circle cx="12" cy="8" r="3.4"></circle>':`<path d="${x}"></path>`).join('');
    return `<button class="tab" data-t="${id}" aria-current="${id===act}"><svg viewBox="0 0 24 24">${paths}</svg>${lbl}</button>`}).join('');
}
function ir(h){location.hash=h}
function render(){
  const h=location.hash.replace(/^#/,'')||'inicio';
  const [v,a]=h.split('/');
  let tab=v, html;
  if(v==='inicio'){html=vInicio()}
  else if(v==='llaves'){html=vLlaves(a)}
  else if(v==='ranking'){html=vRanking(a&&decodeURIComponent(a))}
  else if(v==='jugadores'){html=vJugadores()}
  else if(v==='subir'){tab='';html=vSubir()}
  else if(v==='jugador'){tab='jugadores';html=vJugador(a)}
  else if(v==='partido'){tab='inicio';html=vPartido(a)}
  else {tab='inicio';html=vInicio()}
  pintarTabs(tab);
  document.querySelector('.atras').classList.toggle('on', ['jugador','partido'].includes(v) || (v==='llaves'&&!!a));
  app.innerHTML=html; window.scrollTo(0,0);
  const q=document.getElementById('q'); if(q){q.oninput=()=>filtrar(q.value);document.getElementById('clr').onclick=()=>{q.value='';filtrar('')};filtrar('')}
  const qj=document.getElementById('qj'); if(qj){qj.oninput=()=>filtrarJ(qj.value);document.getElementById('clrj').onclick=()=>{qj.value='';filtrarJ('')}}
}
function filtrar(v){
  const n=norm(v.trim());
  document.getElementById('clr').style.visibility=n?'visible':'hidden';
  document.querySelectorAll('#lista .m').forEach(el=>{
    const seg=n&&el.dataset.q.includes(n), pos=n&&el.dataset.p.includes(n);
    el.classList.toggle('hidden', !!n&&!seg&&!pos); el.classList.toggle('is-pos', !!n&&!seg&&pos)});
  document.querySelectorAll('#lista .slot-h').forEach(s=>{let e=s.nextElementSibling,any=false;
    while(e&&e.classList.contains('m')){if(!e.classList.contains('hidden'))any=true;e=e.nextElementSibling}
    s.classList.toggle('hidden',!any)});
  document.querySelectorAll('#lista .dia').forEach(s=>s.classList.toggle('hidden',![...s.querySelectorAll('.m')].some(m=>!m.classList.contains('hidden'))));
}
function filtrarJ(v){const n=norm(v.trim());
  document.getElementById('clrj').style.visibility=n?'visible':'hidden';
  document.querySelectorAll('#jlist .jc').forEach(el=>el.classList.toggle('hidden',!!n&&!el.dataset.q.includes(n)))}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]'); if(t)return ir(t.dataset.t);
  const c=e.target.closest('[data-cat]'); if(c)return ir('llaves/'+c.dataset.cat);
  const r=e.target.closest('[data-rk]'); if(r)return ir('ranking/'+r.dataset.rk);
  const j=e.target.closest('[data-j]'); if(j)return ir('jugador/'+j.dataset.j);
  const m=e.target.closest('[data-m]'); if(m)return ir('partido/'+encodeURIComponent(m.dataset.m));
});
document.querySelector('.atras').onclick=()=>history.length>1?history.back():ir('inicio');
document.querySelector('.marca').onclick=()=>ir('inicio');
addEventListener('hashchange',render);
document.addEventListener('click',e=>{
  const b=e.target.closest('#leer'); if(b)return leerPegado();
  const p=e.target.closest('#publicar'); if(p)return publicar();
  const g=e.target.closest('#guardatok'); if(g){localStorage.setItem(TK,document.getElementById('tok').value.trim());
    document.getElementById('estado').innerHTML='<span class="ok">Token guardado en este computador</span>';return}
  const f=e.target.closest('[data-fix]'); if(f)return fixLado(+f.dataset.fix, f.dataset.lado);
});
(async function arranque(){
  try{ const r=await fetch('resultados.json?t='+Date.now());
    if(r.ok){ const d=await r.json(); RES=d.partidos||{}; META_RES={actualizado:d.actualizado} } }
  catch(e){}
  render();
})();
